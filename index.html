<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="ASI Poetry — Ajab Singh की शायरी, कविताएँ और एहसास।">
<meta name="theme-color" content="#07152f">

<title>ASI Poetry | Ajab Singh</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    system-ui,
    "Noto Sans Devanagari",
    "Mangal",
    sans-serif;
  background:#061126;
  color:#f5f7ff;
  line-height:1.7;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(6,17,38,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-circle{
  width:45px;
  height:45px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(135deg,#0b75ff,#35c6ff);
  box-shadow:0 0 25px rgba(35,155,255,.35);
}

.logo-text{
  font-size:1.2rem;
  font-weight:800;
}

.logo-text span{
  display:block;
  font-size:.65rem;
  color:#8ea7ce;
  letter-spacing:2px;
}

nav a{
  color:#dbe7ff;
  text-decoration:none;
  margin-left:22px;
  font-size:.95rem;
  transition:.25s;
}

nav a:hover{
  color:#48c8ff;
}

/* ================= HERO ================= */

.hero{
  min-height:650px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 35%,rgba(20,118,255,.22),transparent 32%),
    radial-gradient(circle at 20% 80%,rgba(0,210,255,.10),transparent 30%),
    #061126;
}

.hero::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border:1px solid rgba(61,184,255,.12);
  border-radius:50%;
  right:-170px;
  top:60px;
}

.hero-container{
  max-width:1150px;
  width:100%;
  margin:auto;
  padding:80px 22px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:60px;
  align-items:center;
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:50px;
  border:1px solid rgba(64,193,255,.3);
  background:rgba(34,136,255,.08);
  color:#61d0ff;
  font-size:.82rem;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(3rem,7vw,5.8rem);
  line-height:1.05;
  letter-spacing:-3px;
  margin-bottom:25px;
}

.hero h1 span{
  background:linear-gradient(90deg,#ffffff,#54cfff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:650px;
  color:#aebdd8;
  font-size:1.12rem;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:12px 22px;
  border-radius:50px;
  text-decoration:none;
  font-weight:700;
  transition:.25s;
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,#087cff,#22c4ff);
  box-shadow:0 10px 30px rgba(10,132,255,.25);
}

.btn-primary:hover{
  transform:translateY(-2px);
}

.btn-outline{
  color:#dbe9ff;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04);
}

/* ================= ASI MARK ================= */

.hero-mark{
  width:310px;
  height:310px;
  margin:auto;
  border-radius:50%;
  border:1px solid rgba(73,199,255,.3);
  display:grid;
  place-items:center;
  position:relative;
  background:
    radial-gradient(circle,rgba(31,133,255,.15),transparent 65%);
  box-shadow:
    0 0 80px rgba(0,139,255,.15),
    inset 0 0 60px rgba(0,139,255,.08);
}

.hero-mark::before,
.hero-mark::after{
  content:"";
  position:absolute;
  border:1px dashed rgba(71,190,255,.25);
  border-radius:50%;
}

.hero-mark::before{
  inset:22px;
}

.hero-mark::after{
  inset:-18px;
}

.mark-text{
  font-size:5rem;
  font-weight:950;
  letter-spacing:-7px;
  background:linear-gradient(135deg,#fff,#37c8ff);
  -webkit-background-clip:text;
  color:transparent;
}

.mark-sub{
  position:absolute;
  bottom:55px;
  font-size:.65rem;
  letter-spacing:3px;
  color:#7ca8d5;
}

/* ================= MAIN ================= */

main{
  max-width:1150px;
  margin:auto;
  padding:70px 22px;
}

.section-heading{
  margin-bottom:30px;
}

.section-heading small{
  color:#48c8ff;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:.72rem;
}

.section-heading h2{
  font-size:2.3rem;
  margin-top:5px;
}

/* ================= POETRY ================= */

.poetry-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.poem-card{
  padding:28px;
  min-height:300px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.09);
  background:
    linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  box-shadow:0 20px 50px rgba(0,0,0,.18);
  transition:.3s;
}

.poem-card:hover{
  transform:translateY(-6px);
  border-color:rgba(64,196,255,.35);
}

.poem-number{
  color:#42c9ff;
  font-size:.75rem;
  letter-spacing:2px;
  margin-bottom:16px;
}

.poem-card h3{
  font-size:1.35rem;
  margin-bottom:20px;
}

.poem{
  white-space:pre-line;
  color:#dce6f7;
  font-size:1.05rem;
}

.author{
  margin-top:25px;
  color:#7185a5;
  font-size:.9rem;
}

/* ================= ABOUT ================= */

.about{
  margin-top:90px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.about-card{
  padding:30px;
  border-radius:22px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);
}

.about-card h3{
  margin-bottom:14px;
  font-size:1.4rem;
}

.about-card p{
  color:#aebdd8;
}

.tags{
  margin-top:18px;
}

.tag{
  display:inline-block;
  padding:7px 13px;
  margin:4px;
  border-radius:30px;
  background:rgba(40,150,255,.1);
  border:1px solid rgba(60,190,255,.15);
  color:#8edcff;
  font-size:.82rem;
}

/* ================= INSTAGRAM ================= */

.social{
  margin-top:70px;
  text-align:center;
  padding:45px 20px;
  border-radius:25px;
  background:
    linear-gradient(135deg,
    rgba(17,103,220,.16),
    rgba(0,194,255,.06));
  border:1px solid rgba(78,195,255,.14);
}

.social h2{
  margin-bottom:10px;
}

.social p{
  color:#9eafca;
  margin-bottom:22px;
}

.instagram{
  display:inline-block;
  padding:11px 22px;
  border-radius:50px;
  color:white;
  text-decoration:none;
  font-weight:700;
  background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

/* ================= FOOTER ================= */

footer{
  border-top:1px solid rgba(255,255,255,.08);
  text-align:center;
  padding:35px 20px;
  color:#687b9c;
  font-size:.9rem;
}

footer strong{
  color:#9bb8df;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .nav{
    padding:13px 16px;
  }

  nav a{
    display:none;
  }

  .hero-container{
    grid-template-columns:1fr;
    text-align:center;
    padding-top:65px;
  }

  .hero p{
    margin-left:auto;
    margin-right:auto;
  }

  .buttons{
    justify-content:center;
  }

  .hero-mark{
    width:240px;
    height:240px;
  }

  .mark-text{
    font-size:4rem;
  }

  .poetry-grid{
    grid-template-columns:1fr;
  }

  .about{
    grid-template-columns:1fr;
    margin-top:65px;
  }

  main{
    padding-top:55px;
  }
}

@media(max-width:430px){

  .hero{
    min-height:620px;
  }

  .hero h1{
    font-size:3rem;
    letter-spacing:-2px;
  }

  .hero-mark{
    width:205px;
    height:205px;
  }

  .mark-text{
    font-size:3.4rem;
  }
}
</style>
</head>
